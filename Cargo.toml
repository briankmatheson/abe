[package]
name = "abe"
version = "0.4.0"
edition = "2021"
description = "Abe Block Exporter: NVMe-oF/TCP volumes from an LVM thin pool, with an HTTP API"
license = "GPL-3.0-or-later"

[dependencies]
cidr = "0.3.1"
env_logger = "0.11.8"
ipnet = "2.11.0"
log = "0.4.27"
nix = { version = "0.29.0", features = [ "default", "mount", "fs" ] }
uuid = { version = "1.16.0", features = [ "v4" ] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env-inventory = "0.2.3"
if-addrs = "0.13.4"
chrono = { version = "0.4", features = ["serde"] }

[package.metadata.deb]
name = "abe-block-exporter"
# Debian ships an unrelated SDL game as "abe"; same binary name, so never both.
conflicts = "abe"
replaces = "abe"
maintainer = "Brian Matheson <brian@brianmatheson.com>"
copyright = "2024, Brian Matheson <brian@brianmatheson.com>"
section = "admin"
priority = "optional"
depends = "lvm2, parted, fio"
extended-description = """
ABE (Abe Block Exporter) is an NVMe-oF block storage server.

WARNING: No authentication. Use only in trusted networks.
"""
assets = [
    ["target/release/abe", "usr/bin/", "755"],
    ["debian/abe.service", "usr/lib/systemd/system/", "644"],
    ["SECURITY_AUDIT.md", "usr/share/doc/abe/", "644"],
    ["debian/abe.default", "etc/default/abe", "644"],
]
conf-files = ["/etc/default/abe"]
maintainer-scripts = "debian/"
