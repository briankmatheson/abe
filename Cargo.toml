[package]
name = "abe"
version = "0.5.2"
edition = "2021"
description = "Abe Block Exporter: NVMe-oF/TCP volumes from an LVM thin pool, with an HTTP API"
license = "GPL-3.0-or-later"

[dependencies]
cidr = "0.3.1"
env_logger = "0.11.8"
ipnet = "2.11.0"
log = "0.4.27"
nix = { version = "0.29.0", features = [ "default", "mount", "fs" ] }
uuid = { version = "1.16.0", features = [ "v4" ] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env-inventory = "0.2.3"
if-addrs = "0.13.4"
chrono = { version = "0.4", features = ["serde"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2"

[dev-dependencies]
# the TLS round-trip test; already pulled in by axum-server, so no new crates
tokio-rustls = "0.26"

[package.metadata.deb]
name = "abe-block-exporter"
revision = "1"
# Debian ships an unrelated SDL game as "abe"; same binary name, so never both.
# Conflicts only (no Replaces): apt refuses to install over it instead of
# removing it. Remove the game by hand first.
conflicts = "abe"
maintainer = "Brian Matheson <brian@brianmatheson.com>"
copyright = "2024, Brian Matheson <brian@brianmatheson.com>"
section = "admin"
priority = "optional"
depends = "lvm2, parted, fio, nftables"
extended-description = """
ABE (Abe Block Exporter) is an NVMe-oF block storage server: volumes from
an LVM thin pool, exported over NVMe/TCP, driven by an HTTPS API with
mutual TLS. Each export's port is fenced (nftables) to the address that
asked for it.
"""
assets = [
    ["target/release/abe", "usr/bin/", "755"],
    ["debian/abe.service", "usr/lib/systemd/system/", "644"],
    ["SECURITY_AUDIT.md", "usr/share/doc/abe/", "644"],
    ["README.md", "usr/share/doc/abe/", "644"],
    ["CHANGELOG.md", "usr/share/doc/abe/", "644"],
    ["debian/abe.default", "etc/default/abe", "644"],
]
conf-files = ["/etc/default/abe"]
maintainer-scripts = "debian/"
